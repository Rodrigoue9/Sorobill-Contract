name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: contract-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            crate:
              - 'contracts/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'Makefile'
              - '.github/workflows/ci.yml'

      - uses: dtolnay/rust-toolchain@stable
        if: steps.filter.outputs.crate == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.filter.outputs.crate == 'true'

      - name: Check
        if: steps.filter.outputs.crate == 'true'
        run: cargo check -p sorobill

      - name: Docs and metadata only
        if: steps.filter.outputs.crate != 'true'
        run: echo "No crate paths changed; compile check skipped."
